services:
  mongodb:
    image: mongo:8
    container_name: mongodb
    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./backend
    container_name: backend
    depends_on:
      - mongodb
    environment:
      MONGO_URI: mongodb://mongodb:27017/todo
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "5173:5173"

volumes:
  mongodb_data:

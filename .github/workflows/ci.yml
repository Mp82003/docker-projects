name: E-Commerce Platform CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  docker-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Product image
        run: |
          docker build \
            -t ecommerce-product:${{ github.sha }} \
            ./17-docker-production-platform/services/product

      - name: Build Auth image
        run: |
          docker build \
            -t ecommerce-auth:${{ github.sha }} \
            ./17-docker-production-platform/services/auth

      - name: Build Order image
        run: |
          docker build \
            -t ecommerce-order:${{ github.sha }} \
            ./17-docker-production-platform/services/order

      - name: Build Notification image
        run: |
          docker build \
            -t ecommerce-notification:${{ github.sha }} \
            ./17-docker-production-platform/services/notification

      - name: Scan Product image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ecommerce-product:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Scan Auth image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ecommerce-auth:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Scan Order image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ecommerce-order:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Scan Notification image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ecommerce-notification:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Product image
        run: |
          docker tag \
            ecommerce-product:${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/ecommerce-product:${{ github.sha }}

      - name: Tag Auth image
        run: |
          docker tag \
            ecommerce-auth:${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/ecommerce-auth:${{ github.sha }}

      - name: Tag Order image
        run: |
          docker tag \
            ecommerce-order:${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/ecommerce-order:${{ github.sha }}

      - name: Tag Notification image
        run: |
          docker tag \
            ecommerce-notification:${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/ecommerce-notification:${{ github.sha }}

      - name: Push Product image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/ecommerce-product:${{ github.sha }}

      - name: Push Auth image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/ecommerce-auth:${{ github.sha }}

      - name: Push Order image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/ecommerce-order:${{ github.sha }}

      - name: Push Notification image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/ecommerce-notification:${{ github.sha }}

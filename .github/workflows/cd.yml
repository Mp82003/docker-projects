name: E-Commerce Platform CD

on:
  workflow_run:
    workflows:
      - E-Commerce Platform CI
    types:
      - completed

jobs:

  deploy:

    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' }}

    runs-on: self-hosted

    permissions:
      contents: read
      packages: read

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"

      - name: Pull application images
        run: |
          docker compose \
            -f 17-docker-production-platform/docker-compose.yml \
            pull product auth order notification

      - name: Deploy application
        run: |
          docker compose \
            -f 17-docker-production-platform/docker-compose.yml \
            up -d \
            product auth order notification nginx

      - name: Verify deployment
        run: |
          docker compose \
            -f 17-docker-production-platform/docker-compose.yml \
            ps

      - name: Verify NGINX container
        run: |
          docker inspect --format='{{.State.Status}}' nginx-gateway | grep -q running

      - name: Verify NGINX health
        run: |
          docker exec nginx-gateway \
            wget -qO- http://localhost/health

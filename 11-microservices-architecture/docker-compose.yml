version: "3.9"

services:

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "3001:3001"

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "3002:3002"

  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "3003:3003"

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "3004:3004"

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - order-service
      - payment-service
      - notification-service

  mongodb:
    image: mongo:8
    container_name: mongodb
    ports:
      - "27017:27017"

  redis:
    image: redis:8
    container_name: redis
    ports:
      - "6379:6379"
